# =============================================================================
# Alembic configuration — V72 (Postgres migration phase 2).
#
# Most knobs are intentionally left at their defaults. The two important
# decisions encoded here:
#
#   1. `script_location = migrations`
#      The Alembic environment lives in `migrations/` next to `alembic.ini`,
#      not in the legacy `alembic/` subdirectory. This keeps it out of the
#      app package import path and avoids any chance of `import migrations`
#      colliding with code.
#
#   2. `sqlalchemy.url` is left BLANK on purpose.
#      The real URL comes from `app.db.base.DATABASE_URL`, which honours the
#      `DATABASE_URL` environment variable and falls back to the SQLite file
#      at `data/site.db`. `migrations/env.py` injects it into the config at
#      runtime. Hard-coding it here would mean baking SQLite paths into the
#      repository, which breaks Postgres deployments.
#
# Run from the repo root (where this file lives):
#
#     alembic upgrade head        # apply all pending migrations
#     alembic downgrade -1        # roll back the last migration
#     alembic current             # show DB's current revision
#     alembic history             # list all revisions
#     alembic revision -m "msg"   # create a new empty migration
#
# To autogenerate a migration from ORM model changes:
#
#     alembic revision --autogenerate -m "describe change"
#
# `--autogenerate` reads `Base.metadata` (from app/db/models.py) and diffs
# it against the live DB. Always review the generated file before committing
# — autogenerate misses things like server-side defaults and CHECK constraints.
# =============================================================================

[alembic]
# Path to migration scripts, relative to this ini file.
script_location = migrations

# Template for new revision filenames. Date prefix makes them sort
# chronologically in the versions/ directory which is much easier to read
# than the default hash-only format.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# All revision timestamps are stored in UTC.
timezone = UTC

# Truncate the slug portion of the filename to keep names manageable.
truncate_slug_length = 40

# Run env.py for *every* invocation, including `--sql` (offline mode).
# We need this because env.py reads DATABASE_URL from app.db.base.
revision_environment = false

# Don't allow Alembic to look outside `script_location` for revisions.
sourceless = false

# Multiple version directories are not used.
# version_locations = %(here)s/migrations/versions

# Output encoding for `--sql` mode (stdout).
output_encoding = utf-8

# Leave blank — env.py supplies the URL from app.db.base.DATABASE_URL.
sqlalchemy.url =


# =============================================================================
# Hooks: post-write hooks run after revision files are generated. We keep
# them off by default to avoid forcing a code formatter dependency on the
# migration toolchain. Re-enable locally if you want black/ruff to format
# new revision files automatically.
# =============================================================================

[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME


# =============================================================================
# Logging — Alembic's default config. Verbose enough for `upgrade head` to
# show what it's doing without flooding the terminal.
# =============================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
